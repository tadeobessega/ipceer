name: Tablero (calculado en GitHub)
# D-49: calcula el índice y arma el tablero sin la PC. Usa los días ya procesados (proc_*.tar del
# release), los paneles cerrados de la rama datos-base, las otras fuentes y los precios web del
# release, y el último datos.json de la PC para las partes que necesitan toda la historia.
# Deja en el release: tablero.html y datos_github.json.
on:
  schedule:
    - cron: "17 11 * * *"    # 08:17 en Argentina, después de procesar SEPA
    - cron: "17 17 * * *"    # 14:17
  workflow_run:
    workflows: ["Procesar SEPA (Plan A)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      solo_sitio:
        description: "Solo rearmar la página con los últimos datos (cambios de diseño, sin recalcular)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: tablero
jobs:
  tablero:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TAG: sepa-archivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: datos-base
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Paneles cerrados, otras fuentes y precios web
        run: |
          mkdir -p data resultados
          cp -r base/panel base/geo base/municipios data/ 2>/dev/null || true
          cp base/datos_pc.json datos_base.json
          # el datos.json más nuevo de la PC, si lo subió al release
          if gh release download "$TAG" -p datos_pc.json -O datos_pc_rel.json 2>/dev/null; then
            python - <<'PY'
          import json
          a, b = json.load(open("datos_base.json", encoding="utf-8")), json.load(open("datos_pc_rel.json", encoding="utf-8"))
          if (b.get("generado") or "") > (a.get("generado") or ""):
              json.dump(b, open("datos_base.json", "w", encoding="utf-8"), ensure_ascii=False)
              print("datos de la PC del release:", b.get("generado"))
          PY
          fi
          # lo que está en el release se baja sí o sí (con reintentos por el límite de la API): sin otras
          # fuentes el índice saldría sin prepagas, y sin vintages.csv se perdería el registro de originales
          activos=""
          for i in 1 2 3 4 5 6; do activos=$(gh release view "$TAG" --json assets -q '.assets[].name') && [ -n "$activos" ] && break; sleep $((i*20)); done
          [ -n "$activos" ] || { echo "::error::no se pudo leer el release"; exit 1; }
          bajar() { for i in 1 2 3 4 5 6; do gh release download "$TAG" -p "$1" -O "$2" --clobber && return 0; echo "reintento $i: $1"; sleep $((i*20)); done; echo "::error::no se pudo bajar $1"; exit 1; }
          if grep -qx otras.tar.gz <<<"$activos"; then bajar otras.tar.gz otras.tar.gz; tar -xzf otras.tar.gz -C data; fi
          if grep -qx otras_fuentes_github.json <<<"$activos"; then bajar otras_fuentes_github.json resultados/otras_fuentes.json; fi
          # registro de lo publicado (primeros valores y revisiones)
          if grep -qx vintages.csv <<<"$activos"; then bajar vintages.csv resultados/vintages.csv; fi
          mkdir -p data/web
          for n in $(grep -E '^web_20[0-9-]+\.parquet$' <<<"$activos"); do
            bajar "$n" "data/web/gh_${n#web_}"
          done
          ls data/panel/semanal data/panel/mensual
      - name: Calcular y armar el tablero
        run: |
          if [ "${{ github.event.inputs.solo_sitio }}" = "true" ] && gh release download "$TAG" -p datos_github.json -O resultados/datos.json 2>/dev/null; then
            ipceer sitio
          else
            ipceer github --base datos_base.json
          fi
      - name: Guardar en el release
        run: |
          cp sitio/index.html tablero_github.html
          cp resultados/datos.json datos_github.json
          cp resultados/vintages.csv vintages.csv 2>/dev/null && gh release upload "$TAG" vintages.csv --clobber || true
          gh release upload "$TAG" tablero_github.html datos_github.json --clobber
          # el tablero que sirve Cloudflare (tablero.html) se reemplaza solo si la PC está atrasada:
          # si la PC ya calculó con los mismos días, su versión es la completa
          ult_gh=$(ls data/panel/diario | sort | tail -1 | cut -c1-10)
          ult_pc=""
          if gh release download "$TAG" -p estado_pc.json -O estado_pc.json 2>/dev/null; then
            ult_pc=$(python -c "import json;print(json.load(open('estado_pc.json'))['ultimo_dia'])")
          fi
          echo "GitHub tiene hasta $ult_gh; la PC, hasta ${ult_pc:-?}"
          if [[ -z "$ult_pc" || "$ult_gh" > "$ult_pc" ]]; then
            cp tablero_github.html tablero.html
            gh release upload "$TAG" tablero.html --clobber
            echo "tablero.html reemplazado por el de GitHub"
          fi
          python -c "import json;d=json.load(open('datos_github.json',encoding='utf-8'));s=(d['series'].get('GBA',{}).get('01') or {}).get('semanal') or [];print('Última semana de alimentos GBA:',s[-1] if s else 'sin datos')"
