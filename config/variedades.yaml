# Variedades dentro de cada clase de alimentos y bebidas.
#
# Para qué sirve: el INDEC no promedia todos los artículos de una clase por igual. Su nivel
# elemental es la VARIEDAD (por ejemplo "fideos secos guiseros", "leche fresca entera en sachet"),
# cada una con su ponderador de gasto (Metodología INDEC n° 32, apartados 5.1 y 5.2). En SEPA, en
# cambio, una clase tiene miles de artículos y las variedades con muchas marcas y presentaciones
# (galletitas, golosinas, fiambres) pesan mucho más que las que tienen pocas (pan, leche, azúcar).
# Estas reglas agrupan los artículos de SEPA en variedades para poder promediar primero dentro de
# cada variedad y después entre variedades (estratificación).
#
# Reglas: expresiones regulares sobre la descripción normalizada (minúsculas, sin tildes, todo lo
# que no es letra o número pasa a espacio, con un espacio al principio y al final). Gana la primera
# variedad cuyo patrón `incluir` matchea y cuyo `excluir` no. Lo que no matchea ninguna queda en
# "otros" de su clase.
#
# `peso`: importancia relativa de la variedad dentro de su clase. El INDEC no publica los
# ponderadores por variedad; estos pesos son una aproximación propia a partir de la estructura de
# la canasta básica alimentaria del INDEC para GBA (gramos por adulto equivalente por precio
# medio) y de la composición de la canasta del IPC. Se documentan en METODOLOGIA.md (decisión D-12).
# Cambiarlos solo si mejora la prueba contra el INDEC.

