# Clase del IPC de cada producto de las tiendas en línea.
# Las reglas se evalúan EN ORDEN sobre la categoría de la tienda (normalizada: minúsculas, sin
# tildes; los niveles separados por " / "). Si ninguna regla coincide con la categoría, se prueba
# con el nombre del producto. Gana la primera regla que coincide con `incluir` y no con `excluir`.
# Lo que no coincide con ninguna queda sin clase y no se usa (el precio igual queda guardado).
# Rubros que ya vienen de SEPA (supermercados): si aparecen en una tienda web no se usan.
excluir_global:
  - '\b(limpieza|almacen|bebidas|lacteos|congelados|fiambres|golosinas|mascotas?|veterinaria|kiosco|desayuno y merienda)\b'
# Repuestos, accesorios y servicios: se descartan mirando el nombre del producto.
descartar_por_nombre:
  - '\b(fundas?|protector(es)? de pantalla|vidrios? templados?|cargador(es)?|cables?|soportes?|repuestos?|garantia|servicio de instalacion|gift ?card|tarjeta de regalo|kit de instalacion)\b'

reglas:
  # --- alimentos frescos
  - clase: "01.1.3"
    solo_categoria: true
    nombre: Pescados y mariscos
    incluir: ['\b(pescados?|mariscos?|pescaderia)\b']
    excluir: ['\b(mascotas?|gatos?|perros?|enlatad[ao]s?|conservas?|rebozad[ao]s?|congelad[ao]s?|carbon|encendido|carne vacuna|pollos?|cerdo|achuras)\b']
  - clase: "01.1.2"
    solo_categoria: true
    nombre: Carnes y derivados
    incluir: ['\b(carnes?|carniceria|vacuna|pollos?|granja|cerdo|porcin[ao]|achuras|embutidos|cordero)\b']
    excluir: ['\b(mascotas?|gatos?|perros?|carbon|encendido|parrillas?|condimentos?|sazonador(es)?|vegetal(es)?|veggie|vegan[ao]s?|rebozad[ao]s?|congelad[ao]s?|hamburguesas?|medallon(es)?|nuggets|salchichas?|fiambres?|caldos?|enlatad[ao]s?|pate|picadillo|empanadas?|tartas?|milanesas? de soja)\b']
