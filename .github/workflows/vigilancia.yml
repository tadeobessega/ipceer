name: Vigilancia

# Si una corrida se cae sin poder avisar (el runner se queda sin memoria y se corta), este flujo lo
# detecta: cada 3 horas mira la última corrida terminada de cada flujo y abre un issue (llega por
# correo) si falló o si hace más de 30 horas que no termina bien. Un issue por flujo y día.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Revisar las corridas
        run: |
          R="$GITHUB_REPOSITORY"; hoy=$(date -u +%F); ahora=$(date -u +%s)
          for wf in tablero.yml telefonia.yml otras_fuentes.yml; do
            ult=$(gh run list -R "$R" -w "$wf" -L 10 --json conclusion,status,createdAt,url \
                  -q '[.[] | select(.status=="completed")] | .[0] | [.conclusion, .createdAt, .url] | @tsv')
            ok=$(gh run list -R "$R" -w "$wf" -L 30 --json conclusion,createdAt -q '[.[] | select(.conclusion=="success")] | .[0].createdAt')
            [ -z "$ult" ] && continue
            concl=$(cut -f1 <<<"$ult"); url=$(cut -f3 <<<"$ult")
            edad=$(( (ahora - $(date -d "${ok:-1970-01-01}" +%s)) / 3600 ))
            motivo=""
            [ "$concl" != "success" ] && [ "$concl" != "cancelled" ] && motivo="la última corrida terminó en '$concl'"
            [ "$edad" -gt 30 ] && motivo="hace $edad horas que no termina bien"
            if [ -n "$motivo" ]; then
              titulo="Vigilancia: $wf ($hoy)"
              if ! gh issue list -R "$R" --state open --search "\"$titulo\" in:title" --json number -q '.[0].number' | grep -q .; then
                gh issue create -R "$R" --title "$titulo" --body "$motivo. Última corrida: $url. Lo guardado en el release no se pisa cuando una corrida falla; la PC recalcula todo en su corrida diaria."
              fi
              echo "::warning::$wf: $motivo"
            else
              echo "$wf: bien"
            fi
          done
      - name: Revisar los nodos (PC)
        # D-71: cada PC sube estado_<nodo>.json al release. Si un nodo pasa 30 h sin latido, issue; si
        # pasan los dos, issue urgente (nadie está bajando SEPA). También avisa si a datos-base le falta
        # el panel de ayer y ningún nodo lo subió.
        run: |
          R="$GITHUB_REPOSITORY"; hoy=$(date -u +%F); ahora=$(date -u +%s); caidos=0; nodos="hp15 thinkpad"
          for n in $nodos; do
            f="estado_$n.json"; [ "$n" = hp15 ] && ! gh release view sepa-archivo -R "$R" --json assets -q '.assets[].name' | grep -qx "$f" && f="estado_pc.json"
            if gh release download sepa-archivo -R "$R" -p "$f" -O "e_$n.json" --clobber 2>/dev/null; then
              c=$(jq -r '.corrida // empty' "e_$n.json"); u=$(jq -r '.ultimo_dia // empty' "e_$n.json")
              edad=$(( (ahora - $(date -d "${c:-1970-01-01}-03:00" +%s)) / 3600 ))
            else edad=9999; u="?"; fi
            if [ "$edad" -gt 30 ]; then
              caidos=$((caidos+1)); titulo="Vigilancia: nodo $n sin latido ($hoy)"
              gh issue list -R "$R" --state open --search "\"$titulo\" in:title" --json number -q '.[0].number' | grep -q . || \
                gh issue create -R "$R" --title "$titulo" --body "El nodo $n no sube su estado hace $edad horas (último día con datos: $u). Revisar que la PC esté prendida y con la tarea IPCEER diario activa."
              echo "::warning::nodo $n: $edad h sin latido"
            else echo "nodo $n: bien ($edad h, último día $u)"; fi
          done
          if [ "$caidos" -ge 2 ]; then
            titulo="URGENTE: los dos nodos del IPCEER están caídos ($hoy)"
            gh issue list -R "$R" --state open --search "\"$titulo\" in:title" --json number -q '.[0].number' | grep -q . || \
              gh issue create -R "$R" --title "$titulo" --body "Ninguna PC sube SEPA. El portal solo guarda los últimos 7 días: cada día sin nodo activo se pierde."
          fi
          ayer=$(date -u -d yesterday +%F)
          if ! gh api "repos/$R/contents/panel/diario/$ayer.parquet?ref=datos-base" >/dev/null 2>&1; then
            echo "::warning::datos-base no tiene el panel de $ayer"
          fi
