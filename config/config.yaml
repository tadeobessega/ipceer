# Parámetros del pipeline. Las rutas son relativas a la raíz del repo.

rutas:
  # Archivo histórico de los zips diarios de SEPA, tal como los publica el portal.
  # Puede ser una ruta absoluta (ej. D:/SEPA o /Users/tadeo/SEPA). La variable de
  # entorno IPCEER_ARCHIVO, si está definida, tiene prioridad.
  crudos: data/crudos
  panel_diario: data/panel/diario
  panel_semanal: data/panel/semanal
  panel_mensual: data/panel/mensual
  resultados: resultados         # CSV publicables (sí se versionan)

descarga:
  ckan_api: https://datos.produccion.gob.ar/api/3/action/package_show
  dataset: sepa-precios
  timeout_segundos: 60
  reintentos: 3
  # El portal solo publica los últimos días: los zips se guardan siempre.

regiones:
  # Una sucursal de la provincia de Buenos Aires se asigna a GBA si está a menos de
  # este radio del Obelisco. Si no tiene coordenadas válidas, se usa la lista de
  # localidades de config/gba_localidades.csv. Es una aproximación a los 24 partidos.
  radio_gba_km: 40
  centro_gba: [-34.6037, -58.3816]

limpieza:
  # Dentro de cada producto-cadena-región-día se descartan precios de sucursal
  # que estén más de este factor por encima o por debajo de la mediana.
  factor_atipico_sucursal: 4.0
  # Relativos mensuales fuera de este rango se descartan (errores de carga,
  # cambios de presentación no informados).
  relativo_min: 0.33
  relativo_max: 3.0

indice:
  # Precio que se usa: "lista" (precio de góndola sin promociones) o
  # "efectivo" (el menor entre lista y promo 1 unitaria).
  precio: lista
  # Mínimo de días con precio en el mes para que un producto entre en la comparación.
  min_dias_mes: 5
  # Mínimo de días con precio en la semana (se relaja si la semana tiene pocos días descargados).
  min_dias_semana: 2
  # Mínimo de productos apareados para calcular el relativo de una clase en una región.
  # Si no se alcanza, se usa el relativo nacional de esa clase.
  min_productos_clase: 8
  # Primer mes del índice (= 100). Si se deja vacío, se usa el primer mes con datos.
  mes_base: null
