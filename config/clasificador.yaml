# Clasificador de productos SEPA en clases COICOP (versión INDEC).
#
# Cómo funciona:
#   - Se normaliza la descripción del producto: minúsculas, sin tildes, "ñ" -> "n",
#     y todo lo que no sea letra o número pasa a ser espacio.
#   - Las reglas se evalúan EN ORDEN. Gana la primera regla en la que algún patrón
#     de "incluir" matchea y ningún patrón de "excluir" matchea.
#   - Los patrones son expresiones regulares de Python sobre el texto normalizado.
#   - Lo que no matchea ninguna regla queda como "sin_clasificar" y no entra al índice.
#     `ipceer reporte-clasificacion` lista los más frecuentes para ir mejorando las reglas.
#   - Para casos puntuales, usar config/clasificacion_manual.csv (tiene prioridad).
#
# El orden importa: las reglas no alimentarias van primero para que, por ejemplo,
# "jabón en polvo" no caiga en otra clase, y las golosinas van antes que los lácteos
# para que "chocolate con leche" no termine en lácteos.

reglas:

  - clase: "09.3.4"
    nombre: Alimentos y productos para mascotas
    incluir:
      - '\b(perro|perros|gato|gatos|cachorro|cachorros|felino|felinos|canino|caninos|mascota|mascotas)\b'
      - '\b(piedras?|arena) sanitarias?\b'
    excluir:
      - '\b(pancho|panchos|salchicha|salchichas)\b'

  - clase: "09.5.4"
    nombre: Artículos de papelería
    incluir:
      - '\b(cuaderno|cuadernos|lapicera|lapiceras|birome|biromes|boligrafo|resaltador|resaltadores|cartulina|resma|crayones|crayon|plasticola|liquid paper|corrector|sacapuntas|abrochadora|broches mariposa)\b'
      - '\blapiz(ces)?\b'
      - '\bgoma de borrar\b'
      - '\brepuesto (de )?hojas\b'
      - '\bpapel (glase|afiche|madera|crepe|barrilete)\b'
      - '\bmarcadores?\b'

  - clase: "05.6.1"
    nombre: Artículos de limpieza y otros bienes no duraderos del hogar
    incluir:
      - '\b(lavandina|lejia|cloro|detergente|detergentes|suavizante|suavizantes|quitamanchas|desengrasante|desinfectante|aromatizante|lustramuebles|insecticida|insecticidas|cucarachicida|raticida|hormiguicida|abrillantador|lavavajillas|limpiador|limpiadores|limpiavidrios|esponja|esponjas|rejilla|rejillas|virulana|fosforos|escoba|escobillon|secador de piso|balde|broches para ropa|servilletas|blanqueador|apresto|almidon para ropa|desodorizante)\b'
      - '\bjabon (en polvo|liquido para (la )?ropa|para (la )?ropa|en pan|blanco|para lavar|de lavar|rallado)\b'
      - '\blimpia ?(vidrios|pisos|muebles|hornos|banos|inodoros|metales|alfombras)\b'
      - '\bdesodorante (de|para) (ambiente|ambientes|inodoro|inodoros|bano)\b'
      - '\b(pastillas?|bloque|bloques|gel) (para|de) (inodoro|inodoros|bano|mochila)\b'
      - '\btrapo (de|para) piso\b'
      - '\b(bolsas?) (de|para) (residuos|basura|freezer|consorcio)\b'
      - '\b(rollo|rollos|papel|toallas?) de cocina\b'
      - '\bpapel (de )?aluminio\b'
      - '\b(film|papel) (adherente|film|de cocina)\b'
      - '\b(espiral|espirales|tabletas?) (para )?mosquitos?\b'
      - '\bsal para lavavajillas\b'
      - '\bcera (para pisos|liquida|autobrillo)\b'
      - '\bvelas?\b'

  - clase: "12.1.3"
    nombre: Artículos para el cuidado personal
    incluir:
      - '\b(shampoo|shampu|champu|acondicionador|acondicionadores|antitranspirante|desodorante|desodorantes|dentifrico|tampones|tampon|panales|pañales|preservativos|preservativo|hisopos|talco|maquillaje|esmalte|quitaesmalte|labial|rimel|bronceador|perfume|fragancia|colonia|tintura|coloracion|afeitadora|maquinita|maquinitas|depilatoria|depilatorio|protectores diarios|protector diario)\b'
      - '\bcrema (de enjuague|para peinar|de peinar|dental|corporal|facial|de manos|para manos|hidratante|antiarrugas|antiage|de afeitar|para afeitar|para pies|de dia|de noche|nutritiva|desmaquillante|para el cuerpo)\b'
      - '\b(pasta|gel) dental\b'
      - '\bcepillo (dental|de dientes|para dientes)\b'
      - '\benjuague bucal\b'
      - '\bhilo dental\b'
      - '\b(espuma|gel|hojas|cartuchos|repuestos?) (de|para) afeitar\b'
      - '\bjabon (de tocador|tocador|de glicerina|glicerina|liquido para manos|de manos|para manos|liquido corporal|corporal|en barra|antibacterial|neutro|facial|exfoliante|intimo|de avena|de coco)\b'
      - '\b(gel|crema|espuma) (de|para) (ducha|bano|cabello|peinar|el pelo)\b'
      - '\b(toallas|toallitas) (femeninas|higienicas|humedas|intimas|desmaquillantes)\b'
      - '\bpapel higienico\b'
      - '\bpanuelos (descartables|desechables|de papel|tissue)\b'
      - '\balgodon\b'
      - '\bprotector solar\b'
      - '\bleche (corporal|de limpieza|hidratante|desmaquillante|limpiadora)\b'
      - '\baceite (corporal|para bebe|para bebes|de bebe|capilar|para el cuerpo)\b'
      - '\bagua (micelar|oxigenada|de colonia)\b'
      - '\bfijador (para el cabello|capilar)\b'
