name: Sonda de tiendas web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/sonda_web.py", "scripts/sonda_hosts.txt", ".github/workflows/sonda_web.yml"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/sonda_web.py scripts/sonda_hosts.txt sonda_web.json
      - run: gh release upload sepa-archivo sonda_web.json --clobber
