  - clase: "02.2.1"
    nombre: Tabaco
    incluir:
      - '\b(cigarrillos|cigarrillo|cigarros|tabaco|habanos|habano|cigarritos)\b'
    excluir:
      - '\b(chocolate|chicle|golosina|caramelo|confites)\b'

  - clase: "02.1.1"
    nombre: Bebidas alcohólicas
    incluir:
