# Parámetros del pipeline. Las rutas son relativas a la raíz del repo.

rutas:
  # Archivo histórico de los zips diarios de SEPA, tal como los publica el portal.
  # Puede ser una ruta absoluta (ej. D:/SEPA o /Users/tadeo/SEPA). La variable de
  # entorno IPCEER_ARCHIVO, si está definida, tiene prioridad.
  crudos: data/crudos
  panel_diario: data/panel/diario
  panel_semanal: data/panel/semanal
  panel_mensual: data/panel/mensual
  resultados: resultados         # CSV publicables (sí se versionan)

descarga:
  ckan_api: https://datos.produccion.gob.ar/api/3/action/package_show
  dataset: sepa-precios
  timeout_segundos: 60
  reintentos: 3
  # El portal solo publica los últimos días: los zips se guardan siempre.
  # Respaldo diario en GitHub (lo llena .github/workflows/respaldo_sepa.yml); la PC baja de
  # ahí los días que le falten.
  respaldo_github:
    repo: tadeobessega/ipceer
    tag: sepa-archivo
  # Plan A (METODOLOGIA.md, D-33): GitHub Actions procesa cada zip y deja proc_AAAA-MM-DD.tar en el
  # release; la PC lo trae. La PC procesa por su cuenta un zip solo si pasaron estos días y GitHub
  # todavía no lo procesó (0 = procesar en la PC todo lo que falte, como antes).
  procesar_local_tras_dias: 0  # GitHub recibe 403 del portal de SEPA: la PC procesa todo apenas baja

regiones:
  # Una sucursal de la provincia de Buenos Aires se asigna a GBA si está a menos de
  # este radio del Obelisco. Si no tiene coordenadas válidas, se usa la lista de
  # localidades de config/gba_localidades.csv. Es una aproximación a los 24 partidos.
  radio_gba_km: 40
  centro_gba: [-34.6037, -58.3816]

limpieza:
  # Dentro de cada producto-cadena-región-día se descartan precios de sucursal
  # que estén más de este factor por encima o por debajo de la mediana.
  factor_atipico_sucursal: 4.0
  # Relativos mensuales fuera de este rango se descartan (errores de carga,
  # cambios de presentación no informados).
  relativo_min: 0.33
  relativo_max: 3.0

indice:
  # primer período que se publica en el tablero (lo anterior queda en los datos pero no se muestra)
  publicado_desde_semana: "2026-W43"
  publicado_desde_mes: "2026-10"
  # nivel general: desde la primera semana y el primer mes con variación de todo lo que se releva
  # (las tiendas en línea, con ropa y farmacias, empezaron el 11/11/2026: semana 46 de base)
  nivel_general_desde_semana: "2026-W47"
  nivel_general_desde_mes: "2026-12"
  # D-52: el índice publicado suma los precios de las tiendas en línea (ropa, calzado, hogar,
  # farmacias, etc.); alimentos (división 01) sigue solo con SEPA
  web:
    usar: true
    excluir_divisiones: ["01"]
  # D-53: servicios sin precios relevados que entran al índice publicado (solo en las clases sin
  # precios propios): tarifas reguladas y cuotas de prepagas, por devengado. El alquiler (ICL o
  # avisos) entra cuando se compare contra el INDEC.
  # D-55: con modelo, educación (INDEC del mismo mes del año anterior) y restaurantes (los bienes
  # del mismo período)
  servicios:
    usar: true
    fuentes: [tarifas, prepagas, educacion, alquiler_icl, combustibles, telefonia, autos]  # D-56, D-57 y D-60
    restaurantes: true   # D-55; con indice.modelos.usar (D-62) no se usa
    # D-64: alquiler con el promedio de las variaciones del ICL de los últimos 6 meses, rezago 1
    # (con meses: 1 y rezago: 0 vuelve a D-56). Jul-24 a oct-26, GBA: RMSE 1,54 contra 3,15.
    alquiler_icl: {meses: 6, rezago: 1, desde_mes: "2026-11"}
  # D-62 (reemplaza a D-55): restaurantes y educación con modelos, desde noviembre de 2026.
  # Coeficientes congelados (IPC del INDEC de GBA, 2017-02 a 2026-08; se revisan solo con meses
  # nuevos del INDEC, ver METODOLOGIA.md). Salarios: github.com/marcos-sacca/salarios.
  modelos:
    usar: true
    desde_mes: "2026-11"
    salarios_max_horas: 12
    restaurantes:     # 11.1, en %: alimentos (01.1) y nivel general sin los rubros modelados, del mes
      con_salario: {alim: 0.2183, ngex: 0.5649, salario: 0.2169}   # salario: gastronómicos, prom. t-7 a t-2
      sin_salario: {alim: 0.1072, ngex: 0.8928}
    educacion:        # 10.1, 10.2, 10.3 y 10.5
      con_paritarias: {const: 1.5870, ngex: 0.2098, ene: -2.7595, dic: -1.5547, paritarias_t1: 0.2889}
      sin_paritarias: {const: 2.0137, ngex: 0.4034, ene: -3.3851, dic: -1.8745}
      marzo: {const: 0.0799, ng12: 0.4732, educ_abr_feb: -0.4052}   # en logaritmos
    expensas:         # 04.1.3 (D-64): NG sin rubros(t), paritaria de encargados(t), aguinaldo (jun, dic) y después (jul, ene)
      con_paritaria: {const: 0.1556, ngex: 0.1596, paritaria: 0.7007, aguinaldo: 14.2859, post_aguinaldo: -11.9882}
      sin_paritaria: {const: 1.0942, ngex: 0.6601, aguinaldo: 10.4365, post_aguinaldo: -9.6813}
    paquetes:         # 09.6 (D-64): modelo de 09.3 y 09.6 del INDEC, NG sin rubros(t) y mes calendario (ene a dic)
      {const: 4.159, ngex: 1.165, meses: [0.0, -8.019, -11.163, -8.895, -6.542, -2.219, 6.063, -9.713, -5.934, -5.038, -4.276, -4.533]}
  # Precio que se usa: "lista" (precio de góndola sin promociones) o
  # "efectivo" (el menor entre lista y promo 1 unitaria).
  precio: lista
  # Mínimo de días con precio en el mes para que un producto entre en la comparación.
  min_dias_mes: 5
  # Mínimo de días con precio en la semana (se relaja si la semana tiene pocos días descargados).
  min_dias_semana: 2
  # Mínimo de productos apareados para calcular el relativo de una clase en una región.
  # Si no se alcanza, se usa el relativo nacional de esa clase.
  min_productos_clase: 8
  # Primer mes del índice (= 100). Si se deja vacío, se usa el primer mes con datos.
  mes_base: null
  # Método del índice elemental (ver METODOLOGIA.md, decisiones D-12 a D-14). Las tres opciones
  # se prueban siempre en la carrera de métodos; acá se fija la que se publica.
  #   estratificar: Jevons dentro de cada variedad (config/variedades.yaml) y promedio ponderado.
  #   populares: solo códigos de barras que venden al menos esta cantidad de comercios en la región (0 = todos).
  #   directo: comparar contra diciembre del año anterior en lugar de encadenar período a período.
  estratificar: true
  populares: 3
  directo: true
  # El semanal sigue con el método anterior (D-37): el mejorado se validó solo contra el INDEC mensual,
  # y en las semanas de octubre y noviembre de 2026 bajaba alimentos de GBA de 0,29% y 0,35% (cerca
  # de lo que publicaban las consultoras) a valores menores. Se revisa cuando haya meses de 2026
  # para comparar.
  semanal:
    estratificar: false
    populares: 0
    directo: false
  # Si entre dos períodos con datos pasan más meses que esto, la serie se corta en tramos
  # (ej. la base 2016-2018 de Zenodo y la actual). Por debajo se compara a través del hueco.
  max_meses_salto: 24

indicadores:
  # Semanas que se muestran en los indicadores complementarios (rotación, cadenas, CBA).
  semanas: 13
  # Un precio "cambió" de una semana a otra si se movió más que este porcentaje.
  umbral_cambio_pct: 0.5
  # Un producto (código de barras) entra en la comparación entre cadenas si lo venden al
  # menos estas cadenas en la región; una cadena entra si tiene al menos estos productos.
  min_cadenas_producto: 3
  min_productos_cadena: 30
  # Una cadena entra en el ranking de la CBA si tiene precio propio para esta parte del costo.
  cobertura_min_cba: 0.6

# Base histórica 2016-2018 (Zenodo): días que se bajan y procesan a la vez.
historico:
  paralelo: 4

# Mapa por provincia y por departamento o partido (sucursales ubicadas con Georef).
geo:
  activo: true
  min_productos: 5         # productos comparables por clase y lugar para medir su variación
  cobertura_min: 0.2       # parte de la canasta de la región que tiene que estar medida
  min_productos_nivel: 30  # productos para estimar el nivel de precios de un lugar

# Municipios con índice propio: las sucursales se asignan por polígono (Georef) y el índice usa los
# ponderadores de la región del IPC indicada. id = código Georef del partido.
municipios:
  - id: "06568"
    nombre: Morón
    region: GBA

hilo:
  # Enlace que va en el último tuit del hilo.
  url: https://claude.ai/artifact/C3tPXgBGkjWig3PiRWFDs9
  # Región de referencia para el tuit de cadenas y la CBA (la CBA del INDEC es la de GBA).
  region_cadenas: GBA
