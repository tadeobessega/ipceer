# Canasta básica alimentaria (CBA) del INDEC para un adulto equivalente, por mes.
# Composición de Gran Buenos Aires (INDEC, "Valorización mensual de la canasta básica
# alimentaria y de la canasta básica total", cuadro "Composición de la canasta para el
# adulto equivalente", vigente desde 2016).
#
# Cada componente se valoriza en cada cadena con la mediana del precio por kilo (o litro)
# de los productos de SEPA cuya descripción cumple `incluir` y no cumple `excluir`
# (expresiones regulares sobre la descripción en mayúsculas y sin tildes).
#   cantidad: gramos (o cm3) por mes
#   base: kg o l (unidad en la que se compara el precio)
#   clases: opcional, limita a productos clasificados en esas clases COICOP (prefijo)
#   gramos_por_unidad: para productos que se venden por unidad (huevos)

fuente: "INDEC, Valorización mensual de la CBA y la CBT, Gran Buenos Aires"
componentes:
  - id: pan
    nombre: Pan
    cantidad: 6750
    base: kg
    incluir: '\bPAN (FRANCES|FLAUTA|MI[GN]+ON|DE CAMPO|BLANCO)\b|\bFLAUTITAS?\b|\bMIGNON\b'
    excluir: 'RALLADO|LACTAL|HAMBURG|PANCHO|DULCE|TOSTAD|SALVADO|SIN TACC|CONGEL|PARA PIZZA'
  - id: galletitas_agua
    nombre: Galletitas de agua
    cantidad: 420
    base: kg
    incluir: '\bGALL?ETITAS?\b.*\b(AGUA|CRACKERS?|SALADAS?)\b|\bCRACKERS?\b'
    excluir: 'SABORIZ|QUESO|SANDWICH|RELLEN'
  - id: galletitas_dulces
    nombre: Galletitas dulces
    cantidad: 210
    base: kg
    incluir: '\bGALL?ETITAS?\b.*\b(DULCES?|VAINILLA|MARIA|CHOCOLATE|RELLENAS?|SURTIDAS?)\b'
    excluir: 'AGUA|CRACKER|SALADA|ARROZ'
  - id: arroz
    nombre: Arroz
    cantidad: 1200
    base: kg
    incluir: '^ARROZ\b'
    excluir: 'GALL?ET|SNACK|LISTO|PREPARAD|CON |SABOR|BARRA|INFL|HARINA|YAMANI|CARNAROLI|ARBORIO|SUSHI|BASMATI|JAZMIN'
