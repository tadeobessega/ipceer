name: tests
# Solo corre los tests con datos sintéticos. La descarga de SEPA no puede correr en
# GitHub Actions (el portal responde 403 a sus servidores): se hace en una PC local.
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
