# Canasta de servicios de un hogar tipo del AMBA, al estilo de la canasta de servicios públicos
# del Observatorio de Tarifas y Subsidios del IIEP (UBA-CONICET): electricidad, gas natural,
# agua potable y transporte público.
#
# Cada componente se valoriza con las tarifas cargadas en config/regulados/tarifas.csv (columna
# `concepto`), multiplicadas por la cantidad mensual de esta lista. Un mes tiene costo total solo si
# TODOS los componentes tienen tarifa vigente todo el mes: si falta una, ese mes queda sin total
# (se muestran los componentes que sí están). Nada se completa con el mes anterior.
#
# Las cantidades son supuestos de consumo de un hogar tipo y tienen que llevar su fuente. Las que
# no tienen fuente todavía están marcadas `pendiente: true` y no se usan.
referencia:
  nombre: Canasta de servicios públicos del AMBA, IIEP (UBA-CONICET)
  url: https://economicas.uba.ar/iiep/
componentes:
  - id: colectivo_caba
    nombre: Colectivo (líneas de la Ciudad)
    concepto: "Colectivo líneas de la Ciudad: boleto mínimo (0-3 km) con SUBE registrada"
    cantidad: 22
    unidad: viajes por mes
    pendiente: true
    nota: falta definir con fuente la cantidad de viajes del hogar tipo
  - id: colectivo_pba
    nombre: Colectivo (líneas provinciales)
    concepto: "Colectivo líneas provinciales (200 en adelante): boleto mínimo (0-3 km) con SUBE registrada"
    cantidad: 22
    unidad: viajes por mes
    pendiente: true
    nota: falta definir con fuente la cantidad de viajes del hogar tipo
  - id: subte
    nombre: Subte
    concepto: "Subte: pasaje de 1 a 20 viajes mensuales con SUBE registrada"
    cantidad: 10
    unidad: viajes por mes
    pendiente: true
    nota: falta definir con fuente la cantidad de viajes del hogar tipo
  - id: electricidad
    nombre: Electricidad (Edenor, T1-R2 sin subsidio, 265 kWh, sin impuestos)
    partes:
      - concepto: "Edenor T1-R2 (151 a 400 kWh) sin subsidio: cargo fijo"
        cantidad: 1
      - concepto: "Edenor T1-R2 (151 a 400 kWh) sin subsidio: cargo variable"
        cantidad: 265
    detalle: 265 kWh por mes
    unidad: kWh por mes
    fuente_cantidad: "IIEP, Reporte de tarifas y subsidios: consumo de 265 kWh/mes"
    fuente_url: https://economicas.uba.ar/iiep/wp-content/uploads/INFORME-IIEP-MARZO-2026.pdf
    nota: >-
      consumo del IIEP (265 kWh por mes). Importe sin impuestos: cargo fijo más 265 kWh por el cargo
      variable de Edenor R2. Cargados los cuadros de enero (desde el 16), mayo y septiembre; faltan
      los demás meses y Edesur
  - id: gas
    nombre: Gas natural (Metrogas, Ciudad, R2 2° sin subsidio, 60,5 m3, sin impuestos)
    partes:
      - concepto: "Metrogas R2 2° sin subsidio (Ciudad de Buenos Aires): cargo fijo"
        cantidad: 1
      - concepto: "Metrogas R1-R2 1° sin subsidio (Ciudad de Buenos Aires): cargo por metro cúbico"
        cantidad: 60.5
    detalle: 60,5 m3 por mes
    unidad: m3 por mes
    fuente_cantidad: "IIEP, Reporte de tarifas y subsidios: consumo de 60,5 m3/mes"
    fuente_url: https://economicas.uba.ar/iiep/wp-content/uploads/INFORME-IIEP-MARZO-2026.pdf
    nota: >-
      consumo del IIEP (60,5 m3 por mes, 726 al año: categoría R2 2°, de 651 a 800 m3 anuales).
      Valores leídos automáticamente de los cuadros del ENARGAS publicados en Infoleg (D-38). El
      cargo por m3 es la primera línea del cuadro (R1-R2 1°), que en los cuadros vigentes es igual al
      de R2 2°; si un cuadro los separa, hay que revisar este componente
  - id: agua
    nombre: Agua potable (AySA)
    concepto: null
    cantidad: null
    unidad: factura mensual
    pendiente: true
    nota: >-
      está cargado el coeficiente K de octubre y noviembre (la tarifa se mueve con K), pero falta la
      factura base: el IIEP usa un hogar de coeficiente zonal medio de la Ciudad y no publica la fórmula
