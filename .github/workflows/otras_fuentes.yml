name: Otras fuentes (frescos, alquileres, BCRA, prepagas, normas y boletines)
# Corre en GitHub lo mismo que el paso "Alquileres y medicamentos" de la PC: Cañuelas, Mercado
# Central, Zonaprop, PAMI y BCRA. Guarda lo bajado en el release "sepa-archivo" (otras.tar.gz) y el
# resumen (otras_fuentes_github.json), así no depende de que la PC esté prendida.
on:
  schedule:
    - cron: "41 12 * * *"   # 09:41 en Argentina
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/otras_fuentes.yml", "src/ipceer/frescos.py", "src/ipceer/otras_fuentes.py", "src/ipceer/consultoras_auto.py", "config/consultoras.yaml", "src/ipceer/prepagas.py", "src/ipceer/normas.py", "src/ipceer/boletines.py", "src/ipceer/autos.py", "config/regulados/prepagas.yaml", "config/regulados/normas.yaml", "config/regulados/boletines.yaml"]
permissions:
  contents: write
  issues: write
concurrency: otras-fuentes
jobs:
  otras:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: sepa-archivo
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}   # D-74: API oficial de X para las consultoras (opcional)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[ponderadores]"
      - name: OCR para los cuadros tarifarios escaneados de la Ciudad (D-40)
        run: sudo apt-get install -y -qq tesseract-ocr poppler-utils >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: datos-base
          path: base
      - name: Recuperar lo ya bajado
        id: recuperar
        run: |
          mkdir -p data
          # sin el archivo anterior se subiría uno sin historia: si está en el release, se baja sí o sí
          activos=""
          for i in 1 2 3 4 5 6; do activos=$(gh release view "$TAG" --json assets -q '.assets[].name') && [ -n "$activos" ] && break; sleep $((i*20)); done
          [ -n "$activos" ] || { echo "::error::no se pudo leer el release"; exit 1; }
          estado=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" -q '.assets[]|select(.name=="otras.tar.gz")|.state' 2>/dev/null || true)
          if [ "$estado" = "uploaded" ]; then
            ok=""; for i in 1 2 3 4 5 6; do gh release download "$TAG" -p otras.tar.gz -O otras.tar.gz --clobber && ok=1 && break; sleep $((i*20)); done
            [ -n "$ok" ] || { echo "::error::no se pudo bajar otras.tar.gz"; exit 1; }
            tar -xzf otras.tar.gz -C data
            cp otras.tar.gz otras_prev.tar.gz   # copia de lo anterior, por si la subida nueva sale mal
          elif [ -n "$estado" ]; then
            echo "::warning::otras.tar.gz quedó a medio subir (estado $estado): se arma de nuevo con lo de datos-base"
          fi
          # lo que bajó la PC y GitHub no tiene (ej. meses viejos de prepagas)
          if [ -d base/otras ]; then mkdir -p data/otras; cp -rn base/otras/. data/otras/; fi
          ls data/otras 2>/dev/null || true
      - name: Bajar
        # tope propio: si una fuente se cuelga, se guarda igual lo bajado hasta ahí (paso siguiente)
        timeout-minutes: 95
        continue-on-error: true
        run: |
          ipceer otras
          python - <<'PY'
          import json, zipfile, pathlib
          r = json.load(open("resultados/otras_fuentes.json", encoding="utf-8"))
          for k, v in r.items():
              if isinstance(v, dict):
                  print(k, "->", {a: (b if not isinstance(b, (list, dict)) else f"{type(b).__name__}({len(b)})") for a, b in v.items()})
              else:
                  print(k, "->", v if not isinstance(v, list) else f"lista({len(v)})")
          # muestra de un archivo del Mercado Central, para controlar el formato
          zs = sorted(pathlib.Path("data/otras/mcba").glob("*.zip"))
          muestra = {}
          if zs:
              with zipfile.ZipFile(zs[-1]) as z:
                  nombres = z.namelist()
                  muestra = {"zip": zs[-1].name, "miembros": nombres[:40]}
                  if nombres:
                      pathlib.Path("muestra_mcba.bin").write_bytes(z.read(nombres[0]))
                      muestra["primero"] = nombres[0]
          json.dump(muestra, open("muestra_mcba.json", "w"), ensure_ascii=False)
          PY
      - name: Guardar en el release
        # solo si se recuperó lo anterior: si no, se subiría un archivo sin historia
        if: always() && steps.recuperar.outcome == 'success'
        run: |
          tar -czf otras.tar.gz -C data otras
          ls -la otras.tar.gz
          subir() { for i in 1 2 3 4; do gh release upload "$TAG" "$1" --clobber && return 0; sleep $((i*15)); done; echo "::error::no se pudo subir $1"; return 1; }
          if [ -f otras_prev.tar.gz ]; then subir otras_prev.tar.gz || true; fi
          subir otras.tar.gz
          cp resultados/otras_fuentes.json otras_fuentes_github.json 2>/dev/null || echo '{"incompleta": true}' > otras_fuentes_github.json
          subir otras_fuentes_github.json
          if [ -s muestra_mcba.json ]; then subir muestra_mcba.json || true; fi
          if [ -s muestra_mcba.bin ]; then subir muestra_mcba.bin || true; fi
      - name: Avisar si falló
        if: failure()
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "Fallaron las otras fuentes ($(date -u +%F))" \
            --body "Corrida: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Lo guardado antes queda como estaba." || true
