name: Sonda de fuentes
# Prueba si GitHub llega a fuentes nuevas antes de programar su descarga. No guarda nada.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/sonda_fuentes.yml", "scripts/sondas/**"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pypdf
      - run: python scripts/sondas/sonda2.py
