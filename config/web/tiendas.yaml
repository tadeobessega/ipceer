# Tiendas en línea con catálogo público (el mismo que usa su propia página). Se bajan una vez por
# día, de a un pedido por vez por tienda y con pausa. Si una tienda no responde o limita los pedidos,
# se anota y se sigue: no se saltea ninguna protección.
#
#   tipo:       vtex | shopify
#   regiones:   regiones del IPC a las que se asigna el precio. Los supermercados muestran por
#               defecto el precio de su zona principal (GBA); las tiendas de alcance nacional
#               tienen un precio único para todo el país ("todas").
#   deptos:     expresión regular sobre el nombre del departamento (primer nivel): solo se bajan
#               esos. En supermercados se bajan los rubros que SEPA no cubre bien (frescos y no
#               alimentarios); almacén, bebidas, lácteos, limpieza y perfumería ya vienen de SEPA.
super: &super
  tipo: vtex
  regiones: [GBA]
  deptos: 'carn|pescad|frut|verdur|panader|rotiser|electro|tecnolog|hogar|bazar|textil|indument|moda|calzado|jugue|librer|deporte|aire libre|tiempo libre|automotor|ferreter|jardin|bebe|farmacia|salud'
nacional: &nacional
  tipo: vtex
  regiones: todas

tiendas:
  # supermercados (frescos y no alimentarios)
