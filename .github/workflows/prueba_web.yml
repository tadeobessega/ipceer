name: Prueba de tiendas (de a una)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/prueba_web.yml"]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      IPCEER_WEB_MAX_PEDIDOS: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/sonda_vtex.py
      - run: gh release upload sepa-archivo prueba_web.json --clobber
